name: chat-agent-web

services:
  chat-agent-web:
    image: chat-agent-web:${IMAGE_TAG:-latest}
    container_name: chat-agent-web
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-3030}:3030"
    environment:
      NODE_ENV: production
      PORT: "3030"
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
      CHAT_API_URL: ${CHAT_API_URL:-${API_URL:-http://chat-agent:9998}}
      SITE_API_URL: ${SITE_API_URL:-http://site:9997}
      ADMIN_USERS: ${ADMIN_USERS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chat-agent
      - site
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  chat-agent:
    name: ${CHAT_AGENT_NETWORK:-chat-agent_default}
  site:
    name: ${SITE_NETWORK:-site_default}
